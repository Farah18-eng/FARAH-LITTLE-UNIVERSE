    <g transform="translate(980 160)"><rect x="-104" y="-70" width="208" height="140" rx="24" fill="url(#glass)" stroke="#a99bff" stroke-opacity=".8" stroke-width="2"/><rect x="-96" y="-62" width="192" height="124" rx="19" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="0" cy="-18" r="29" fill="#253b72" stroke="#a99bff" stroke-opacity=".7"/><rect x="-17" y="-29" width="34" height="23" rx="4" fill="none" stroke="#c9c0ff" stroke-width="3"/><path d="m-15 -26 15 12 15-12" fill="none" stroke="#c9c0ff" stroke-width="3"/><text x="0" y="42" fill="#fff" font-size="17" font-weight="700">EMAIL</text><text x="0" y="58" fill="#a9dff1" font-size="9" letter-spacing="2">SAY HELLO</text></g>
    <g transform="translate(220 540)"><rect x="-104" y="-70" width="208" height="140" rx="24" fill="url(#glass)" stroke="#69d9f5" stroke-opacity=".8" stroke-width="2"/><rect x="-96" y="-62" width="192" height="124" rx="19" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="0" cy="-18" r="29" fill="#253b72" stroke="#69d9f5" stroke-opacity=".7"/><text x="0" y="-7" fill="#69d9f5" font-family="Arial,sans-serif" font-size="34" font-weight="800" text-anchor="middle">U</text><text x="0" y="42" fill="#fff" font-size="17" font-weight="700">UiTM</text><text x="0" y="58" fill="#a9dff1" font-size="9" letter-spacing="2">MY CAMPUS</text></g>
    <g transform="translate(600 595)"><rect x="-104" y="-70" width="208" height="140" rx="24" fill="url(#glass)" stroke="#a99bff" stroke-opacity=".8" stroke-width="2"/><rect x="-96" y="-62" width="192" height="124" rx="19" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="0" cy="-18" r="29" fill="#253b72" stroke="#a99bff" stroke-opacity=".7"/><rect x="-16" y="-30" width="32" height="25" rx="4" fill="none" stroke="#c9c0ff" stroke-width="3"/><circle cx="0" cy="-18" r="7" fill="none" stroke="#c9c0ff" stroke-width="3"/><circle cx="10" cy="-25" r="2" fill="#c9c0ff"/><text x="0" y="42" fill="#fff" font-size="17" font-weight="700">GALLERY</text><text x="0" y="58" fill="#a9dff1" font-size="9" letter-spacing="2">MY MEMORIES</text></g>
    <g transform="translate(980 540)"><rect x="-104" y="-70" width="208" height="140" rx="24" fill="url(#glass)" stroke="#69d9f5" stroke-opacity=".8" stroke-width="2"/><rect x="-96" y="-62" width="192" height="124" rx="19" fill="none" stroke="#fff" stroke-opacity=".1"/><circle cx="0" cy="-18" r="29" fill="#253b72" stroke="#69d9f5" stroke-opacity=".7"/><circle cx="-9" cy="-23" r="8" fill="none" stroke="#69d9f5" stroke-width="3"/><circle cx="10" cy="-23" r="8" fill="none" stroke="#69d9f5" stroke-width="3"/><path d="M-24 -4c0-9 7-13 15-13s15 4 15 13M-6 -4c0-9 7-13 16-13s15 4 15 13" fill="none" stroke="#69d9f5" stroke-width="3" stroke-linecap="round"/><text x="0" y="42" fill="#fff" font-size="17" font-weight="700">FRIENDS</text><text x="0" y="58" fill="#a9dff1" font-size="9" letter-spacing="2">MY PEOPLE</text></g>
  </g>
  <text x="600" y="675" text-anchor="middle" fill="#8fa5d0" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">SIX CONNECTIONS · ONE LITTLE UNIVERSE</text>
</svg>
