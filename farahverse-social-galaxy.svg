<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Farahverse Social Galaxy</title>
  <desc id="desc">A central Farahverse planet connected by orbital rings to six destinations: Instagram, TikTok, Email, UiTM, Gallery and Friends.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%"><stop offset="0" stop-color="#1b2e59"/><stop offset=".62" stop-color="#101c3a"/><stop offset="1" stop-color="#091329"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#314b86" stop-opacity=".96"/><stop offset="1" stop-color="#172448" stop-opacity=".94"/></linearGradient>
    <linearGradient id="cyanLavender" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#69d9f5"/><stop offset="1" stop-color="#a99bff"/></linearGradient>
    <radialGradient id="core" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#718cff"/><stop offset=".55" stop-color="#5865d9"/><stop offset="1" stop-color="#263b75"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>
  <g opacity=".25" stroke="#69d9f5" stroke-width="1">
    <path d="M0 140H1200M0 350H1200M0 560H1200" stroke-dasharray="2 14"/>
    <path d="M200 0V700M600 0V700M1000 0V700" stroke-dasharray="2 14"/>
  </g>
  <g fill="#dbe8ff" opacity=".8">
    <circle cx="105" cy="100" r="3"/><circle cx="1090" cy="90" r="2.5"/><circle cx="90" cy="590" r="2"/><circle cx="1110" cy="590" r="3"/><circle cx="420" cy="60" r="2"/><circle cx="790" cy="640" r="2"/><circle cx="760" cy="80" r="2.5"/><circle cx="390" cy="630" r="2"/>
  </g>
  <g fill="#69d9f5" opacity=".9" font-family="Arial,sans-serif" font-size="22"><text x="160" y="310">✦</text><text x="1010" y="330">✧</text><text x="585" y="40">✦</text><text x="585" y="680">✧</text></g>
  <ellipse cx="600" cy="350" rx="465" ry="245" fill="none" stroke="#69d9f5" stroke-opacity=".25" stroke-width="2" transform="rotate(-13 600 350)"/>
  <ellipse cx="600" cy="350" rx="465" ry="245" fill="none" stroke="#a99bff" stroke-opacity=".25" stroke-width="2" transform="rotate(13 600 350)" stroke-dasharray="7 11"/>
  <ellipse cx="600" cy="350" rx="285" ry="150" fill="none" stroke="#a99bff" stroke-opacity=".18" stroke-width="1.5"/>
  <g filter="url(#glow)" opacity=".45"><circle cx="600" cy="350" r="145" fill="#5865d9"/></g>
  <g>
    <circle cx="600" cy="350" r="112" fill="url(#core)" stroke="url(#cyanLavender)" stroke-width="5"/>
    <circle cx="600" cy="350" r="96" fill="none" stroke="#eaf3ff" stroke-opacity=".42" stroke-width="1.5"/>
    <text x="600" y="355" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="68" font-weight="800">F✦</text>
    <text x="600" y="395" text-anchor="middle" fill="#dceaff" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">FARAHVERSE</text>
  </g>
